<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # No hay .htaccess en este starter (no hace falta reescribir nada:
        # cada archivo de public/ ES la URL), asi que no hace falta permitir
        # overrides.
        AllowOverride None
        Require all granted

        # Sin esto, PHP corriendo como modulo de Apache (mod_php) no ve el
        # header Authorization en $_SERVER: Apache lo retiene salvo que se
        # pida explicito. CGIPassAuth solo es valido en contexto directory/
        # .htaccess, no directamente en VirtualHost. Reemplaza al truco de
        # mod_rewrite que usan los starters con router.
        CGIPassAuth On
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
